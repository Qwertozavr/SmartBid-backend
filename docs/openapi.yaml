openapi: 3.0.3
info:
  title: SmartBid Backend API
  version: 1.0.0
  description: API for SmartBid ad management.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health checks.
  - name: Ads
    description: Ad management.
paths:
  /ping:
    get:
      tags:
        - Health
      summary: Health check
      operationId: ping
      responses:
        "200":
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              examples:
                ok:
                  value:
                    status: ok
  /api/v1/ads:
    post:
      tags:
        - Ads
      summary: Create ad
      operationId: createAd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdRequest"
            examples:
              withDescription:
                value:
                  title: iPhone 15 Pro
                  chat_id: 123456789
                  message_id: 42
                  description: Almost new, 256 GB
                  photo: iVBORw0KGgo=
              withoutDescription:
                value:
                  title: iPhone 15 Pro
                  chat_id: 123456789
                  message_id: 42
      responses:
        "201":
          description: Ad was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Invalid request body or invalid ad data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidAd:
                  value:
                    error: "invalid ad: title is required"
        "500":
          description: Failed to create ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: failed to create ad
  /api/v1/ads/{id}:
    get:
      tags:
        - Ads
      summary: Get ad by ID
      operationId: findAdById
      parameters:
        - name: id
          in: path
          required: true
          description: Ad UUID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ad was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "400":
          description: Missing or invalid ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: id is required
        "404":
          description: Ad was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: ad not found
        "500":
          description: Failed to find ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: failed to find ad
  /api/v1/ads/{id}/increase:
    post:
      tags:
        - Ads
      summary: Increase ad price
      operationId: increaseAdPrice
      parameters:
        - name: id
          in: path
          required: true
          description: Ad UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncreaseAdPriceRequest"
            examples:
              bidder:
                value:
                  pretendent_id: 123
      responses:
        "200":
          description: Ad price was increased by 5%.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdPriceUpdate"
        "400":
          description: Invalid request body or invalid ad data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidAd:
                  value:
                    error: "invalid ad: pretendent_id must be greater than zero"
                samePretendent:
                  value:
                    error: "invalid ad: pretendent_id must differ from previous pretendent_id"
        "404":
          description: Ad was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: ad not found
        "500":
          description: Failed to increase ad price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: failed to increase ad price
  /api/v1/ads/{id}/publish:
    post:
      tags:
        - Ads
      summary: Publish ad
      operationId: publishAd
      parameters:
        - name: id
          in: path
          required: true
          description: Ad UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAdRequest"
            example:
              chat_id: 123456789
      responses:
        "200":
          description: Ad was published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid request body, chat ID, or ad data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidBody:
                  value:
                    error: invalid request body
                invalidChatId:
                  value:
                    error: "invalid ad: chat_id must be greater than zero"
                differentChatId:
                  value:
                    error: "invalid ad: chat_id does not match ad chat_id"
        "404":
          description: Ad was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: ad not found
        "500":
          description: Failed to publish ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: failed to publish ad
  /api/v1/ads/{id}/remove:
    post:
      tags:
        - Ads
      summary: Remove ad
      operationId: removeAd
      parameters:
        - name: id
          in: path
          required: true
          description: Ad UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAdRequest"
            example:
              chat_id: 123456789
      responses:
        "200":
          description: Ad was removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid request, chat ID, or state transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ad was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to remove ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    PingResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    CreateAdRequest:
      type: object
      required:
        - title
        - chat_id
        - message_id
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          example: iPhone 15 Pro
        chat_id:
          type: integer
          format: int32
          example: 123456789
        message_id:
          type: integer
          format: int32
          example: 42
        description:
          type: string
          nullable: true
          description: Optional ad description. It may be omitted or null.
          example: Almost new, 256 GB
        photo:
          type: string
          format: byte
          description: Optional photo encoded as base64.
          example: iVBORw0KGgo=
    IncreaseAdPriceRequest:
      type: object
      required:
        - pretendent_id
      additionalProperties: false
      properties:
        pretendent_id:
          type: integer
          format: int32
          minimum: 1
          description: ID of the latest user who offered the price.
          example: 123
    PublishAdRequest:
      type: object
      required:
        - chat_id
      additionalProperties: false
      properties:
        chat_id:
          type: integer
          format: int32
          minimum: 1
          description: ID of the chat that owns the ad.
          example: 123456789
    RemoveAdRequest:
      type: object
      required:
        - chat_id
      additionalProperties: false
      properties:
        chat_id:
          type: integer
          format: int32
          minimum: 1
          description: ID of the chat that owns the ad.
          example: 123456789
    AdPriceUpdate:
      type: object
      required:
        - id
        - price
        - message
      properties:
        id:
          type: string
          format: uuid
          example: 7aaf3e98-9e46-4a7e-9cb4-99a46d25a442
        price:
          type: integer
          format: int64
          example: 105
        message:
          type: string
          example: Успешно
    SuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Успешно
    CreateAdResponse:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          required:
            - message
          properties:
            message:
              type: string
              example: Успешно
    Ad:
      type: object
      required:
        - id
        - title
        - chat_id
        - message_id
        - description
        - price
        - pretendent_id
        - status
        - published_at
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 7aaf3e98-9e46-4a7e-9cb4-99a46d25a442
        title:
          type: string
          example: iPhone 15 Pro
        chat_id:
          type: integer
          format: int32
          example: 123456789
        message_id:
          type: integer
          format: int32
          example: 42
        description:
          type: string
          nullable: true
          example: Almost new, 256 GB
        photo:
          type: string
          format: byte
          description: Photo encoded as base64. Omitted when empty.
          example: iVBORw0KGgo=
        price:
          type: integer
          format: int64
          example: 100
        pretendent_id:
          type: integer
          format: int32
          nullable: true
          description: ID of the latest user who offered the price.
          example: 123
        status:
          $ref: "#/components/schemas/AdStatus"
        published_at:
          type: string
          format: date-time
          nullable: true
          example: 2026-06-01T12:00:00Z
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: 2026-06-02T12:00:00Z
        created_at:
          type: string
          format: date-time
          example: 2026-06-01T12:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-06-01T12:00:00Z
    AdStatus:
      type: string
      enum:
        - created
        - published
        - canceled
        - bought
        - removed
        - expired
      example: created
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid request body
