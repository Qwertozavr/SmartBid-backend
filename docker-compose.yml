services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbid-backend
    environment:
      SERVICE_HOST: "${SERVICE_HOST}"
      SERVICE_PORT: "${SERVICE_PORT}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSLMODE: "${DB_SSLMODE}"
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}"
      MIGRATIONS_DIR: "/app/migrations"
    ports:
      - "${SERVICE_HOST}:${SERVICE_PORT}:${SERVICE_PORT}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: smartbid-postgres
    command: ["postgres", "-c", "port=${DB_PORT}"]
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    volumes:
      - smartbid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smartbid_pg_data:
